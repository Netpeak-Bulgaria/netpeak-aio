name: WordPress.org deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, curl, json, xml

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-progress --classmap-authoritative --optimize-autoloader

      - name: Strip composer temp files
        run: |
          find vendor -name "tmp-*" -delete 2>/dev/null || true
          find vendor -name "*.zip~" -delete 2>/dev/null || true
          find vendor -name "*~" -delete 2>/dev/null || true

      - name: Extract version from tag
        id: strip_v
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Deploy to WordPress.org plugin repository
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WORDPRESS_ORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WORDPRESS_ORG_SVN_PASSWORD }}
          SLUG: netpeak-analytics-kit
          VERSION: ${{ steps.strip_v.outputs.version }}