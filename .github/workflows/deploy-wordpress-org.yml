name: WordPress.org deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, curl, json, xml

      - name: Check version consistency
        run: |
          HEADER_VERSION=$(grep -m1 '^\s*\*\s*Version:' netpeak-analytics-kit.php | sed 's/.*Version:[[:space:]]*//' | tr -d ' \r')
          DEFINE_VERSION=$(grep "define('NTP_AIO_VERSION'" netpeak-analytics-kit.php | sed "s/.*define('NTP_AIO_VERSION', '\([^']*\)').*/\1/")
          echo "Plugin header version : $HEADER_VERSION"
          echo "NTP_AIO_VERSION define: $DEFINE_VERSION"
          if [ "$HEADER_VERSION" != "$DEFINE_VERSION" ]; then
            echo "::error file=netpeak-analytics-kit.php::Version mismatch: header says '$HEADER_VERSION' but NTP_AIO_VERSION is '$DEFINE_VERSION'. Update both to the same value."
            exit 1
          fi
          echo "OK — versions match: $HEADER_VERSION"

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-progress --classmap-authoritative --optimize-autoloader

      - name: Strip composer temp files
        run: |
          find vendor -name "tmp-*" -delete 2>/dev/null || true
          find vendor -name "*.zip~" -delete 2>/dev/null || true
          find vendor -name "*~" -delete 2>/dev/null || true

      - name: Extract version from tag
        id: strip_v
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Deploy to WordPress.org plugin repository
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WORDPRESS_ORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WORDPRESS_ORG_SVN_PASSWORD }}
          SLUG: netpeak-analytics-kit
          VERSION: ${{ steps.strip_v.outputs.version }}